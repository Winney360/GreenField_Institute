<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · Greenfield Institute</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <div class="auth-wrap">
        <h2>Create student account</h2>
        <div id="msg"></div>

        <form id="signupForm" novalidate>
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" required maxlength="120" />
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" required />
            </div>
            <div class="field">
                <label for="password">Password (min 8 characters)</label>
                <input type="password" id="password" required minlength="8" />
            </div>
            <button type="submit" id="submitBtn">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="index.html">Sign in</a></p>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const btn  = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true; btn.textContent = 'Creating…';
            const res = await api.post('api/register.php', {
                full_name: form.name.value.trim(),
                email:     form.email.value.trim(),
                password:  form.password.value
            });
            if (res.ok) {
                window.location.href = res.redirect;
            } else {
                flash('msg', res.error || 'Registration failed.', 'error');
                btn.disabled = false; btn.textContent = 'Create account';
            }
        });
    </script>
</body>
</html>
