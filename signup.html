<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · Greenfield Institute</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Theme script loads before <body> so the right mode is set before paint
         (avoids a brief flash of the wrong theme on page load). -->
    <script src="assets/js/theme.js"></script>
</head>
<body class="auth-page">
    <!-- Light/dark toggle -->
    <button class="theme-toggle" aria-label="Toggle light/dark mode" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
    </button>

    <div class="auth-card auth-card--signup">
        <!-- Hero image panel (left side on signup) — text lives on the white side now -->
        <div class="auth-card__dark">
            <img class="auth-card__hero" src="assets/img/login-hero.jpeg" alt="Greenfield Institute campus" />
        </div>

        <!-- Form panel (right side on signup) -->
        <div class="auth-card__form">
            <div class="auth-card__form-inner">
                <div class="auth-welcome">
                    <h1>CREATE ACCOUNT</h1>
                    <p>Create a student account to enrol in courses at Greenfield Institute.</p>
                </div>

                <form id="signupForm" novalidate>
                    <div class="auth-field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required maxlength="120" />
                        <!-- person icon -->
                        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
                        </svg>
                    </div>

                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" required />
                        <!-- envelope icon -->
                        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 7l9 6 9-6"/>
                        </svg>
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" required minlength="8" />
                        <!-- lock icon -->
                        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="4" y="11" width="16" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                        </svg>
                    </div>

                    <button type="submit" id="submitBtn" class="auth-btn">Sign Up</button>
                </form>

                <div id="msg" class="auth-card__msg"></div>

                <p class="auth-card__switch">
                    Already have an account? <a href="index.html">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const btn  = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true; btn.textContent = 'Creating…';
            const res = await api.post('api/register.php', {
                full_name: form.name.value.trim(),
                email:     form.email.value.trim(),
                password:  form.password.value
            });
            if (res.ok) {
                window.location.href = res.redirect;
            } else {
                flash('msg', res.error || 'Registration failed.', 'error');
                btn.disabled = false; btn.textContent = 'Sign Up';
            }
        });
    </script>
</body>
</html>
