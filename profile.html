    <main class="main">

        <h2>My profile</h2>
        <div id="msg"></div>

        <div class="course-card" style="max-width: 480px; margin-top: 1rem;">
            <h3 style="margin-bottom: 1rem;">Account details</h3>
            <p style="margin: 0.25rem 0;"><strong>Name:</strong> <span id="pName">—</span></p>
            <p style="margin: 0.25rem 0;"><strong>Email:</strong> <span id="pEmail">—</span></p>
            <p style="margin: 0.25rem 0;"><strong>Role:</strong> <span id="pRole">—</span></p>
        </div>
      </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
        (async () => {
            const me = await api.get('api/me.php');
            if (me.ok) {
                document.getElementById('pName').textContent  = me.user.full_name;
                document.getElementById('pEmail').textContent = me.user.email;
                document.getElementById('pRole').textContent  = me.user.role;
            } else {
                flash('msg', 'Could not load profile.', 'error');
            }
        })();
    </script>
