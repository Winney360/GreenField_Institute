    <main class="main">
      <div class="container">
        <div class="dash-section__header">
            <h2 style="color: var(--color-primary); margin: 0;">Current Registered Units</h2>
        </div>
        <div id="msg"></div>
        <table id="regTable">
            <thead>
                <tr>
                    <th>Unit Name</th>
                    <th>Unit Code</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script>
        async function load() {
            const res = await api.get('api/my_courses.php');
            const rowsEl = document.getElementById('rows');
            if (!res.ok) { flash('msg', res.error || 'Failed to load.', 'error'); return; }

            // Show every status except dropped (those are gone from "current").
            const list = res.registrations.filter(r => r.status !== 'dropped');

            if (!list.length) {
                rowsEl.innerHTML = `
                    <tr><td colspan="4" style="color: var(--text-muted); text-align: center; padding: 1.5rem;">
                        You have not registered for any courses yet.
                        <a href="courses.html" style="color: var(--color-primary); font-weight: 600;">Browse the catalogue</a> to get started.
                    </td></tr>`;
                return;
            }

            rowsEl.innerHTML = list.map(r => `
                <tr>
                    <td>${escapeHtml(r.title)}</td>
                    <td>${escapeHtml(r.course_code)}</td>
                    <td><span class="status-pill status-${escapeHtml(r.status)}">${escapeHtml(r.status)}</span></td>
                    <td>${r.status !== 'rejected'
                        ? `<button class="btn-danger" data-id="${r.course_id}">Drop</button>`
                        : ''
                    }</td>
                </tr>
            `).join('');

            rowsEl.querySelectorAll('button[data-id]').forEach(b =>
                b.addEventListener('click', () => drop(b.dataset.id))
            );
        }

        async function drop(courseId) {
            if (!confirm('Drop this course?')) return;
            const res = await api.post('api/drop.php', { course_id: Number(courseId) });
            if (res.ok) { flash('msg', 'Course dropped.', 'success'); load(); }
            else        { flash('msg', res.error || 'Drop failed.', 'error'); }
        }

        load();
    </script>
