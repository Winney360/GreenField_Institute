    <main class="main">
      <div class="container">
        <h2>Settings</h2>
        <p style="color:var(--text-muted); margin-top:0;">
            Manage your account security. Choose a strong password — at least 8 characters.
        </p>
        <div id="msg"></div>

        <form id="passwordForm" class="course-card" style="max-width: 480px; margin-top: 1rem;">
            <h3 style="margin: 0 0 1rem;">Change password</h3>

            <div class="field" style="position: relative;">
                <label for="curPw">Current password</label>
                <input id="curPw" type="password" required minlength="8" />
            </div>

            <div class="field" style="position: relative;">
                <label for="newPw">New password</label>
                <input id="newPw" type="password" required minlength="8" />
            </div>

            <div class="field" style="position: relative;">
                <label for="confirmPw">Confirm new password</label>
                <input id="confirmPw" type="password" required minlength="8" />
            </div>

            <button type="submit" id="saveBtn">Update password</button>
        </form>
      </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
        const form = document.getElementById('passwordForm');
        const btn  = document.getElementById('saveBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const cur     = document.getElementById('curPw').value;
            const next    = document.getElementById('newPw').value;
            const confirm = document.getElementById('confirmPw').value;

            if (next !== confirm) {
                flash('msg', 'New password and confirmation do not match.', 'error');
                return;
            }

            btn.disabled = true; btn.textContent = 'Saving…';
            const res = await api.post('api/change_password.php', {
                current_password: cur,
                new_password:     next,
            });
            if (res.ok) {
                flash('msg', 'Password updated.', 'success');
                form.reset();
            } else {
                flash('msg', res.error || 'Update failed.', 'error');
            }
            btn.disabled = false; btn.textContent = 'Update password';
        });
    </script>
