<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenfield Institute</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
    <!-- Set the auth mode (login or signup) immediately so there's no flicker.
         URL hash decides; defaults to login. -->
    <script>
        document.body.classList.add(
            window.location.hash === '#signup' ? 'mode-signup' : 'mode-login'
        );
    </script>

    <div class="auth-card">
        <!-- Hero image panel — diagonal slab whose side flips between modes -->
        <div class="auth-card__dark">
            <img class="auth-card__hero" src="assets/img/login-hero.jpeg" alt="Greenfield Institute campus" />
        </div>

        <!-- Form panel — holds BOTH views, only the active one is visible -->
        <div class="auth-card__form">
            <div class="auth-card__form-inner">

                <!-- ============ LOGIN VIEW ============ -->
                <div class="auth-view auth-view--login">
                    <div class="auth-welcome">
                        <h1>WELCOME BACK!</h1>
                        <p>Sign in to manage your course registrations at Greenfield Institute.</p>
                    </div>

                    <form id="loginForm" autocomplete="on" novalidate>
                        <div class="auth-field">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" name="email" required />
                            <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="M3 7l9 6 9-6"/>
                            </svg>
                        </div>

                        <div class="auth-field">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" name="password" required minlength="8" />
                            <button type="button" class="auth-field__toggle" data-password-toggle aria-label="Show password">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>

                        <button type="submit" class="auth-btn">Login</button>
                    </form>

                    <p class="auth-card__switch">
                        Don't have an account? <a href="#signup" data-switch-to="signup">Sign Up</a>
                    </p>
                </div>

                <!-- ============ SIGNUP VIEW (account activation) ============ -->
                <div class="auth-view auth-view--signup">
                    <div class="auth-welcome">
                        <h1>SIGN UP</h1>
                        <p>Use the school email and registration number you were given on admission.</p>
                    </div>

                    <form id="signupForm" novalidate>
                        <div class="auth-field">
                            <label for="signupRegNum">Registration Number</label>
                            <input type="text" id="signupRegNum" name="registration_number" required maxlength="20" />
                            <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="16" rx="2"/>
                                <path d="M7 8h10M7 12h10M7 16h6"/>
                            </svg>
                        </div>

                        <div class="auth-field">
                            <label for="signupEmail">Email</label>
                            <input type="email" id="signupEmail" name="email" required />
                            <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="M3 7l9 6 9-6"/>
                            </svg>
                        </div>

                        <div class="auth-field">
                            <label for="signupPassword">Password</label>
                            <input type="password" id="signupPassword" name="password" required minlength="8" />
                            <button type="button" class="auth-field__toggle" data-password-toggle aria-label="Show password">
                                <svg class="icon-eye" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>

                        <button type="submit" class="auth-btn">Sign up</button>
                    </form>

                    <p class="auth-card__switch">
                        Already have an account? <a href="#login" data-switch-to="login">Login</a>
                    </p>
                </div>

                <div id="msg" class="auth-card__msg"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
