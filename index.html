<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Greenfield Institute</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
    <div class="auth-card auth-card--login">
        <!-- Dark welcome panel (right side on login) -->
        <div class="auth-card__dark">
            <h1>WELCOME<br/>BACK!</h1>
            <p>Sign in to manage your course registrations at Greenfield Institute.</p>
        </div>

        <!-- Form panel (left side on login) -->
        <div class="auth-card__form">
            <div class="auth-card__form-inner">
                <h2>Login</h2>

                <form id="loginForm" autocomplete="on" novalidate>
                    <div class="auth-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required />
                        <!-- envelope icon -->
                        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="M3 7l9 6 9-6"/>
                        </svg>
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="8" />
                        <!-- lock icon -->
                        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="4" y="11" width="16" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                        </svg>
                    </div>

                    <button type="submit" id="submitBtn" class="auth-btn">Login</button>
                </form>

                <div id="msg" class="auth-card__msg"></div>

                <p class="auth-card__switch">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btn  = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true; btn.textContent = 'Signing in…';
            const res = await api.post('api/login.php', {
                email: form.email.value.trim(),
                password: form.password.value
            });
            if (res.ok) {
                window.location.href = res.redirect;
            } else {
                flash('msg', res.error || 'Login failed.', 'error');
                btn.disabled = false; btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
